name: Actualizar cotización del oro

on:
  workflow_dispatch: {}   # permite lanzarlo a mano desde la pestaña "Actions", o desde cron-job.org

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Actualizar historico.json
        run: python scripts/actualizar_oro.py

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add historico.json
          git diff --cached --quiet || git commit -m "Actualiza cotización del oro $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase origin main
          git push
